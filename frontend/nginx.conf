server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Facturas de hasta 10 MB (el frontend ya lo valida); nginx rechaza por defecto más de 1 MB.
    client_max_body_size 12m;

    # El backend va detrás de /api. La barra final en proxy_pass quita el prefijo:
    # /api/facturas -> http://backend:8000/facturas (el backend no usa prefijo /api).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El OCR y la IA pueden tardar bastante en responder.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Archivos con hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: cualquier otra ruta (/facturas, /contratos...) devuelve index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
